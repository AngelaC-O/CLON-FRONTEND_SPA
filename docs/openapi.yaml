          application/json:
            example:
              idPromocion: 3
              saldoFavorAplicado: 5.0
            schema:
              $ref: "#/components/schemas/DescuentosDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                adelantoAplicado: 10.0
                cobrosPendientes: []
                descuento: 0.0
                estado: ABIERTA
                idCaja: 214
                idCliente: 407
                idSede: 1
                idVenta: 8812
                igv: 0.0
                pagado: 0
                pagos: []
                pendiente: 45.0
                saldoFavorAplicado: 5.0
                subtotal: 60.0
                total: 45.0
              schema:
                $ref: "#/components/schemas/VentaDTO"
          description: Totales recalculados
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
        "404":
          content:
            application/problem+json:
              example:
                detail: La venta no existe
                regla: RF21
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La venta no existe
        "422":
          content:
            application/problem+json:
              example:
                detail: La promoción no aplica (-20047) o el saldo no alcanza (-20064)
                regla: ORA-20064
                status: 422
                title: Unprocessable Content
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La promoción no aplica (-20047) o el saldo no alcanza (-20064)
      security:
      - csrf: []
        sesion: []
      summary: "Aplicar promoción, adelanto de la cita y saldo a favor"
      tags:
      - controlador-venta
      x-cus: CUS18
  /api/v1/ventas/{idVenta}/pagos:
    post:
      operationId: registrarPagos
      parameters:
      - in: path
        name: idVenta
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            example:
              pagos:
              - canal: QR
                idMedioPago: 2
                monto: 40.0
              - idMedioPago: 1
                monto: 20.0
            schema:
              $ref: "#/components/schemas/PagosDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                cobrosPendientes: []
                estado: ABIERTA
                idVenta: 8812
                pagado: 60.0
                pagos:
                - idMedioPago: 2
                  idPago: 9901
                  idTransaccion: 5510
                  monto: 40.0
                  referencia: IZ-000184322
                - idMedioPago: 1
                  idPago: 9902
                  monto: 20.0
                pendiente: 0.0
                total: 60.0
              schema:
                $ref: "#/components/schemas/VentaDTO"
          description: Pagos registrados
        "202":
          content:
            application/json:
              example:
                cobrosPendientes:
                - enlacePago: https://enlace-de-izipay.example/abc
                  idTransaccion: 5510
                estado: ABIERTA
                idVenta: 8812
                pagado: 0
                pagos: []
                pendiente: 60.0
                total: 60.0
              schema:
                $ref: "#/components/schemas/VentaDTO"
          description: Un cobro quedó PENDIENTE en Izipay y no suma; con el webhook
            aprobado se reenvía con idTransaccion (RN42)
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
        "404":
          content:
            application/problem+json:
              example:
                detail: La venta no existe
                regla: RF21
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La venta no existe
        "422":
          content:
            application/problem+json:
              example:
                detail: La pasarela rechazó el cobro o la transacción aún no está
                  APROBADA
                regla: RF103
                status: 422
                title: Unprocessable Content
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La pasarela rechazó el cobro o la transacción aún no está APROBADA
      security:
      - csrf: []
        sesion: []
      summary: Registrar pagos
      tags:
      - controlador-venta
      x-cus: CUS18
