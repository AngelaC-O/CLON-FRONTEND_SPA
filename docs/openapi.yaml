openapi: 3.1.0
info:
  description: "Contrato del back-end de la Iteración 1 (CS-BO-01). Los errores salen\
    \ como ProblemDetail, con la propiedad regla."
  title: Cautiva Spa · BackOffice · Iteración 1
  version: "1.0"
servers:
- url: /
paths:
  /api/v1/areas:
    get:
      operationId: listarAreas
      responses:
        "200":
          content:
            application/json:
              example:
              - idArea: 1
                linea: SALON
                nombreArea: Peluquería y Estilismo
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaDTO"
          description: Áreas
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
      security:
      - sesion: []
      summary: Listar las áreas
      tags:
      - controlador-catalogo
      x-cus: CUS57
    post:
      operationId: registrarArea
      requestBody:
        content:
          application/json:
            example:
              linea: SPA
              nombreArea: Masajes
            schema:
              $ref: "#/components/schemas/AreaDTO"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                idArea: 6
                linea: SPA
                nombreArea: Masajes
              schema:
                $ref: "#/components/schemas/AreaDTO"
          description: Área creada
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
        "409":
          content:
            application/problem+json:
              example:
                detail: Ya existe un área con ese nombre
                regla: UQ_AREA_NOMBRE
                status: 409
                title: Conflict
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Ya existe un área con ese nombre
      security:
      - csrf: []
        sesion: []
      summary: Registrar un área
      tags:
      - controlador-catalogo
      x-cus: CUS57
  /api/v1/atenciones:
    post:
      operationId: iniciar
      requestBody:
        content:
          application/json:
            example:
              idCita: 950
              tiempoDeclaradoMin: 45
            schema:
              $ref: "#/components/schemas/InicioAtencionDTO"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                estado: EN_CURSO
                horaInicio: 2026-11-09T10:02:00
                idAtencion: 1532
                idCita: 950
                idCliente: 407
                idPersonal: 4
                idRecurso: 1
                idVariante: 2
                tiempoDeclaradoMin: 45
              schema:
                $ref: "#/components/schemas/AtencionDTO"
          description: Atención EN_CURSO y cita EN_ATENCION
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
        "404":
          content:
            application/problem+json:
              example:
                detail: La cita no existe
                regla: RF13
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cita no existe
        "409":
          content:
            application/problem+json:
              example:
                detail: El tiempo declarado choca con otra cita
                regla: RN02
                status: 409
                title: Conflict
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El tiempo declarado choca con otra cita
        "422":
          content:
            application/problem+json:
              example:
                detail: Solo se atiende una cita PENDIENTE
                regla: RF13
                status: 422
                title: Unprocessable Content
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Solo se atiende una cita PENDIENTE
      security:
      - csrf: []
        sesion: []
      summary: Iniciar la atención de una cita
      tags:
      - controlador-atencion
      x-cus: CUS11
  /api/v1/atenciones/{idAtencion}/fin:
    patch:
      operationId: finalizar
      parameters:
      - in: path
        name: idAtencion
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            example:
              observaciones: Sin novedad
            schema:
              $ref: "#/components/schemas/DetalleAtencionDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                estado: FINALIZADA
                horaFin: 2026-11-09T10:45:00
                horaInicio: 2026-11-09T10:02:00
                idAtencion: 1532
                idCita: 950
                idCliente: 407
                idPersonal: 4
                idRecurso: 1
                idVariante: 2
                observaciones: Sin novedad
                tiempoDeclaradoMin: 45
              schema:
                $ref: "#/components/schemas/AtencionDTO"
          description: "Atención y cita FINALIZADAS; con un paquete activo, la sesió\
            n se descuenta"
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
        "404":
          content:
            application/problem+json:
              example:
                detail: La atención no existe
                regla: RF13
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La atención no existe
        "422":
          content:
            application/problem+json:
              example:
                detail: Solo se finaliza una atención EN_CURSO
                regla: RF13
                status: 422
                title: Unprocessable Content
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Solo se finaliza una atención EN_CURSO
      security:
      - csrf: []
        sesion: []
      summary: Finalizar la atención
      tags:
      - controlador-atencion
      x-cus: CUS11
  /api/v1/auth/cambio-clave:
    post:
      operationId: cambiarClave
      requestBody:
        content:
          application/json:
            example:
              claveActual: ClaveDeEjemplo2026
              claveNueva: ClaveNueva2026
            schema:
              $ref: "#/components/schemas/CambioClaveDTO"
        required: true
      responses:
        "200":
          description: Clave cambiada
        "400":
          content:
            application/problem+json:
              example:
                detail: La clave nueva no tiene de 8 a 72 caracteres
                regla: VALIDACION
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La clave nueva no tiene de 8 a 72 caracteres
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
        "422":
          content:
            application/problem+json:
              example:
                detail: La clave actual no coincide
                regla: RF82
                status: 422
                title: Unprocessable Content
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La clave actual no coincide
      security:
      - csrf: []
        sesion: []
      summary: "Cambiar la clave propia (no está en el draw.io, DF-18)"
      tags:
      - controlador-autenticacion
      x-cus: CUS50
  /api/v1/auth/login:
    post:
      operationId: iniciarSesion
      requestBody:
        content:
          application/json:
            example:
              clave: ClaveDeEjemplo2026
              nombreUsuario: recepcion
            schema:
              $ref: "#/components/schemas/CredencialesDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                debeCambiarClave: false
                idSede: 1
                idUsuario: 2
                nombreUsuario: recepcion
                permisos:
                - AGENDA:VER
                - CLIENTAS:CREAR
                - VENTAS:CREAR
              schema:
                $ref: "#/components/schemas/SesionDTO"
          description: "Sesión creada, con las cookies de sesión y XSRF-TOKEN"
        "400":
          content:
            application/problem+json:
              example:
                detail: Faltan el usuario o la clave
                regla: VALIDACION
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Faltan el usuario o la clave
        "401":
          content:
            application/problem+json:
              example:
                detail: Usuario o clave incorrectos
                regla: RF77
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Usuario o clave incorrectos
        "423":
          content:
            application/problem+json:
              example:
                detail: La cuenta está bloqueada por intentos fallidos o inactiva
                regla: RF77
                status: 423
                title: Locked
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cuenta está bloqueada por intentos fallidos o inactiva
      security: []
      summary: Iniciar sesión
      tags:
      - controlador-autenticacion
      x-cus: CUS50
  /api/v1/auth/logout:
    post:
      operationId: cerrarSesion
      responses:
        "200":
          description: Sesión cerrada y auditada
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
      security:
      - csrf: []
        sesion: []
      summary: Cerrar sesión
      tags:
      - controlador-autenticacion
      x-cus: CUS51
  /api/v1/cajas:
    post:
      operationId: abrir
      requestBody:
        content:
          application/json:
            example:
              montoInicial: 100.0
            schema:
              $ref: "#/components/schemas/AperturaCajaDTO"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                arqueos: []
                estado: ABIERTA
                fechaApertura: 2026-10-22T08:55:00
                idCaja: 214
                idSede: 1
                idUsuarioApertura: 2
                montoInicial: 100.0
              schema:
                $ref: "#/components/schemas/CajaDTO"
          description: Caja ABIERTA
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
        "409":
          content:
            application/problem+json:
              example:
                detail: La sede ya tiene una caja abierta
                regla: RN30
                status: 409
                title: Conflict
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La sede ya tiene una caja abierta
      security:
      - csrf: []
        sesion: []
      summary: Abrir la caja de la sede
      tags:
      - controlador-caja
      x-cus: CUS44
  /api/v1/cajas/{idCaja}/cierre:
    post:
      operationId: cerrar_1
      parameters:
      - in: path
        name: idCaja
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            example:
              arqueos:
              - idMedioPago: 1
                montoContado: 145.0
                observacion: Faltan cinco soles
              - idMedioPago: 2
                montoContado: 40.0
              egresos:
              - concepto: Compra menor
                monto: 10.0
            schema:
              $ref: "#/components/schemas/ArqueoDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                arqueos:
                - diferencia: -5.0
                  idMedioPago: 1
                  montoContado: 145.0
                  montoEsperado: 150.0
                  observacion: Faltan cinco soles
                estado: CERRADA
                fechaCierre: 2026-10-22T20:05:00
                idCaja: 214
                idSede: 1
                idUsuarioApertura: 2
                idUsuarioCierre: 2
                montoInicial: 100.0
              schema:
                $ref: "#/components/schemas/CajaDTO"
          description: Caja CERRADA; Oracle calcula lo esperado y la diferencia
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
        "404":
          content:
            application/problem+json:
              example:
                detail: La caja no existe
                regla: RN30
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La caja no existe
        "422":
          content:
            application/problem+json:
              example:
                detail: Diferencia sin observación
                regla: RN30
                status: 422
                title: Unprocessable Content
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Diferencia sin observación
      security:
      - csrf: []
        sesion: []
      summary: Cerrar la caja con egresos y arqueo
      tags:
      - controlador-caja
      x-cus: CUS45
  /api/v1/cajas/{idCaja}/esperado:
    get:
      operationId: calcularEsperado
      parameters:
      - in: path
        name: idCaja
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              example:
                comprobantesPendientes:
                - estadoSunat: PENDIENTE
                  fechaLimite: 2026-10-25
                  idComprobante: 7121
                  numero: "00000420"
                  serie: B001
                  tipo: BOLETA
                estado: ABIERTA
                idCaja: 214
                medios:
                - aprobadoPasarela: 0
                  esperado: 160.0
                  idMedioPago: 1
                  medioPago: EFECTIVO
                - aprobadoPasarela: 40.0
                  esperado: 40.0
                  idMedioPago: 2
                  medioPago: YAPE
                montoInicial: 100.0
              schema:
                $ref: "#/components/schemas/EsperadoDTO"
          description: Esperado de V_CAJA_ESPERADO y aprobados de la pasarela
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
        "404":
          content:
            application/problem+json:
              example:
                detail: La caja no existe
                regla: RN30
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La caja no existe
      security:
      - sesion: []
      summary: "Lo esperado por medio de pago, lo aprobado y los comprobantes pendientes"
      tags:
      - controlador-caja
      x-cus: CUS45
  /api/v1/citas:
    post:
      operationId: agendar
      requestBody:
        content:
          application/json:
            example:
              duracionMin: 30
              fechaHoraInicio: 2026-11-09T10:00:00
              idCliente: 407
              idPersonal: 4
              idRecurso: 1
              idVariante: 2
            schema:
              $ref: "#/components/schemas/CitaDTO"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                adelantoMonto: 0.0
                duracionMin: 30
                estado: PENDIENTE
                fechaHoraFin: 2026-11-09T11:00:00
                fechaHoraInicio: 2026-11-09T10:00:00
                idCita: 950
                idCliente: 407
                idPersonal: 4
                idRecurso: 1
                idSede: 1
                idUsuario: 2
                idVariante: 2
              schema:
                $ref: "#/components/schemas/CitaDTO"
          description: Cita creada; Oracle calcula el fin con la limpieza del recurso
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
        "409":
          content:
            application/problem+json:
              example:
                detail: Cruce de horario de la especialista o del recurso
                regla: RN02
                status: 409
                title: Conflict
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Cruce de horario de la especialista o del recurso
        "422":
          content:
            application/problem+json:
              example:
                detail: La especialista no tiene el área del servicio (-20012) o la
                  clienta no existe
                regla: RF83
                status: 422
                title: Unprocessable Content
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La especialista no tiene el área del servicio (-20012) o la
            clienta no existe
      security:
      - csrf: []
        sesion: []
      summary: Agendar una cita
      tags:
      - controlador-cita
      x-cus: CUS05
  /api/v1/citas/agenda:
    get:
      operationId: consultarAgenda
      parameters:
      - in: query
        name: fecha
        required: true
        schema:
          type: string
          format: date
      - in: query
        name: idPersonal
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: idRecurso
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              example:
              - estado: PENDIENTE
                fin: 2026-11-09T11:00:00
                franja: OCUPADA
                idOrigen: 950
                idPersonal: 4
                idRecurso: 1
                idVariante: 2
                inicio: 2026-11-09T10:00:00
                origen: CITA
              - fin: 2026-11-09T19:00:00
                franja: LIBRE
                idPersonal: 4
                inicio: 2026-11-09T11:00:00
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BloqueAgendaDTO"
          description: Franjas ocupadas (con limpieza) y libres; LIBRE es de una especialista
            o de un recurso
        "400":
          content:
            application/problem+json:
              example:
                detail: Falta la fecha
                regla: VALIDACION
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta la fecha
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              example:
                detail: No tiene permiso para esta operación.
                regla: ACCESO_DENEGADO
                status: 403
                title: Forbidden
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene permiso para esta operación.
      security:
      - sesion: []
      summary: Consultar la agenda del día
      tags:
