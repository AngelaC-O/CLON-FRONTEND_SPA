openapi: 3.1.0
info:
  description: "Contrato del back-end de las Iteraciones 1, 2 y 2.1 (CS-BO-01). Los\
    \ errores salen como ProblemDetail, con la propiedad regla. x-permiso es el permiso\
    \ MODULO:ACCION que exige cada operación (SESION: basta con iniciar sesión; PUBLICO:\
    \ sin sesión)."
  title: Cautiva Spa · BackOffice · Iteración 2.1
  version: "2.1"
servers:
- url: /
paths:
  /api/v1/areas:
    get:
      operationId: listarAreas
      responses:
        "200":
          content:
            application/json:
              example:
              - idArea: 1
                linea: SALON
                nombreArea: Peluquería y Estilismo
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AreaDTO"
          description: Áreas
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              examples:
                claveTemporal:
                  summary: "Con la clave temporal sin cambiar (CUS50, CUS54)"
                  value:
                    detail: Debe cambiar su clave temporal antes de continuar.
                    regla: RF82
                    status: 403
                    title: Forbidden
                    type: about:blank
                sinPermiso:
                  summary: Sin el permiso de la operación
                  value:
                    detail: No tiene el permiso CATALOGO:VER para esta operación.
                    regla: ACCESO_DENEGADO
                    status: 403
                    title: Forbidden
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene el permiso CATALOGO:VER para esta operación. (ACCESO_DENEGADO);
            con la clave temporal sin cambiar (RF82)
      security:
      - sesion: []
      summary: Listar las áreas
      tags:
      - controlador-catalogo
      x-cus: CUS57
      x-permiso: CATALOGO:VER
    post:
      operationId: registrarArea
      requestBody:
        content:
          application/json:
            example:
              linea: SPA
              nombreArea: Masajes
            schema:
              $ref: "#/components/schemas/AreaDTO"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                idArea: 6
                linea: SPA
                nombreArea: Masajes
              schema:
                $ref: "#/components/schemas/AreaDTO"
          description: Área creada
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              examples:
                claveTemporal:
                  summary: "Con la clave temporal sin cambiar (CUS50, CUS54)"
                  value:
                    detail: Debe cambiar su clave temporal antes de continuar.
                    regla: RF82
                    status: 403
                    title: Forbidden
                    type: about:blank
                sinPermiso:
                  summary: Sin el permiso de la operación
                  value:
                    detail: No tiene el permiso CATALOGO:CREAR para esta operación.
                    regla: ACCESO_DENEGADO
                    status: 403
                    title: Forbidden
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene el permiso CATALOGO:CREAR para esta operación. (ACCESO_DENEGADO);
            con la clave temporal sin cambiar (RF82)
        "409":
          content:
            application/problem+json:
              example:
                detail: Ya existe un área con ese nombre
                regla: UQ_AREA_NOMBRE
                status: 409
                title: Conflict
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Ya existe un área con ese nombre
      security:
      - csrf: []
        sesion: []
      summary: Registrar un área
      tags:
      - controlador-catalogo
      x-cus: CUS57
      x-permiso: CATALOGO:CREAR
  /api/v1/atenciones:
    post:
      operationId: iniciar
      requestBody:
        content:
          application/json:
            example:
              idCita: 950
              tiempoDeclaradoMin: 45
            schema:
              $ref: "#/components/schemas/InicioAtencionDTO"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                estado: EN_CURSO
                horaInicio: 2026-11-09T10:02:00
                idAtencion: 1532
                idCita: 950
                idCliente: 407
                idPersonal: 4
                idRecurso: 1
                idVariante: 2
                nombreCliente: Rosaura Quispe
                nombreEspecialista: Lucía Ramos
                nombreRecurso: Sillón 1
                nombreServicio: Corte de Cabello Caballero · Estándar
                tiempoDeclaradoMin: 45
              schema:
                $ref: "#/components/schemas/AtencionDTO"
          description: "Atención EN_CURSO y cita EN_ATENCION; solo la especialista\
            \ asignada o la administradora (si no, 403 por RN50)"
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              examples:
                claveTemporal:
                  summary: "Con la clave temporal sin cambiar (CUS50, CUS54)"
                  value:
                    detail: Debe cambiar su clave temporal antes de continuar.
                    regla: RF82
                    status: 403
                    title: Forbidden
                    type: about:blank
                sinPermiso:
                  summary: Sin el permiso de la operación
                  value:
                    detail: No tiene el permiso ATENCION:CREAR para esta operación.
                    regla: ACCESO_DENEGADO
                    status: 403
                    title: Forbidden
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene el permiso ATENCION:CREAR para esta operación. (ACCESO_DENEGADO);
            con la clave temporal sin cambiar (RF82)
        "404":
          content:
            application/problem+json:
              example:
                detail: La cita no existe
                regla: RF13
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cita no existe
        "409":
          content:
            application/problem+json:
              example:
                detail: El tiempo declarado choca con otra cita
                regla: RN02
                status: 409
                title: Conflict
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El tiempo declarado choca con otra cita
        "422":
          content:
            application/problem+json:
              example:
                detail: Solo se atiende una cita PENDIENTE
                regla: RF13
                status: 422
                title: Unprocessable Content
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Solo se atiende una cita PENDIENTE
      security:
      - csrf: []
        sesion: []
      summary: Iniciar la atención de una cita
      tags:
      - controlador-atencion
      x-cus: CUS11
      x-permiso: ATENCION:CREAR
  /api/v1/atenciones/en-curso:
    get:
      operationId: obtenerEnCurso
      parameters:
      - in: query
        name: idCita
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              example:
                estado: EN_CURSO
                horaInicio: 2026-11-09T10:02:00
                idAtencion: 1532
                idCita: 950
                idCliente: 407
                idPersonal: 4
                idRecurso: 1
                idVariante: 2
                nombreCliente: Rosaura Quispe
                nombreEspecialista: Lucía Ramos
                nombreRecurso: Sillón 1
                nombreServicio: Corte de Cabello Caballero · Estándar
                tiempoDeclaradoMin: 45
              schema:
                $ref: "#/components/schemas/AtencionDTO"
          description: "La atención EN_CURSO de la cita, para retomarla desde otro\
            \ equipo"
        "400":
          content:
            application/problem+json:
              example:
                detail: Falta la cita
                regla: VALIDACION
                status: 400
                title: Bad Request
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Falta la cita
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              examples:
                claveTemporal:
                  summary: "Con la clave temporal sin cambiar (CUS50, CUS54)"
                  value:
                    detail: Debe cambiar su clave temporal antes de continuar.
                    regla: RF82
                    status: 403
                    title: Forbidden
                    type: about:blank
                sinPermiso:
                  summary: Sin el permiso de la operación
                  value:
                    detail: No tiene el permiso ATENCION:VER para esta operación.
                    regla: ACCESO_DENEGADO
                    status: 403
                    title: Forbidden
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene el permiso ATENCION:VER para esta operación. (ACCESO_DENEGADO);
            con la clave temporal sin cambiar (RF82)
        "404":
          content:
            application/problem+json:
              example:
                detail: La cita no tiene una atención EN_CURSO
                regla: RF13
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La cita no tiene una atención EN_CURSO
      security:
      - sesion: []
      summary: Retomar la atención en curso de una cita
      tags:
      - controlador-atencion
      x-cus: CUS11
      x-permiso: ATENCION:VER
  /api/v1/atenciones/mi-agenda:
    get:
      operationId: listarMiAgenda
      parameters:
      - in: query
        name: fecha
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              example:
              - duracionMin: 30
                estado: EN_ATENCION
                estadoAtencion: EN_CURSO
                fechaHoraFin: 2026-11-09T10:30:00
                fechaHoraInicio: 2026-11-09T10:00:00
                idAtencion: 1532
                idCita: 950
                idCliente: 407
                idRecurso: 1
                idVariante: 2
                nombreCliente: Rosaura Quispe
                nombreRecurso: Sillón 1
                nombreServicio: Corte de Cabello Caballero · Estándar
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitaAtencionDTO"
          description: "Citas del día de la especialista de la sesión, con su atenció\
            n EN_CURSO si la tiene; sin fecha, la de hoy"
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              examples:
                claveTemporal:
                  summary: "Con la clave temporal sin cambiar (CUS50, CUS54)"
                  value:
                    detail: Debe cambiar su clave temporal antes de continuar.
                    regla: RF82
                    status: 403
                    title: Forbidden
                    type: about:blank
                sinPermiso:
                  summary: Sin el permiso de la operación
                  value:
                    detail: No tiene el permiso ATENCION:VER para esta operación.
                    regla: ACCESO_DENEGADO
                    status: 403
                    title: Forbidden
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene el permiso ATENCION:VER para esta operación. (ACCESO_DENEGADO);
            con la clave temporal sin cambiar (RF82)
      security:
      - sesion: []
      summary: Mi agenda del día (la especialista de la sesión)
      tags:
      - controlador-atencion
      x-cus: CUS11
      x-permiso: ATENCION:VER
  /api/v1/atenciones/productos:
    get:
      operationId: buscarProductos_1
      parameters:
      - in: query
        name: nombre
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              example:
              - codigo: PRD-001
                idCategoria: 2
                idProducto: 40
                marca: Loreal
                nombre: Shampoo reparador
                precioVenta: 45.0
                stockActual: 8
                unidad: UND
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductoStockDTO"
          description: "Productos de venta activos de la sede, con su precio y su\
            \ stock (sin costo, RN24)"
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              examples:
                claveTemporal:
                  summary: "Con la clave temporal sin cambiar (CUS50, CUS54)"
                  value:
                    detail: Debe cambiar su clave temporal antes de continuar.
                    regla: RF82
                    status: 403
                    title: Forbidden
                    type: about:blank
                sinPermiso:
                  summary: Sin el permiso de la operación
                  value:
                    detail: No tiene el permiso ATENCION:VER para esta operación.
                    regla: ACCESO_DENEGADO
                    status: 403
                    title: Forbidden
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene el permiso ATENCION:VER para esta operación. (ACCESO_DENEGADO);
            con la clave temporal sin cambiar (RF82)
      security:
      - sesion: []
      summary: Buscar productos para recomendar
      tags:
      - controlador-atencion
      x-cus: CUS12
      x-permiso: ATENCION:VER
  /api/v1/atenciones/{idAtencion}/fin:
    patch:
      operationId: finalizar
      parameters:
      - in: path
        name: idAtencion
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            example:
              observaciones: Sin novedad
            schema:
              $ref: "#/components/schemas/DetalleAtencionDTO"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                consumosPendientes:
                - cantidadDescontada: 10
                  cantidadEstimada: 30
                  cantidadPendiente: 20
                  codigo: INS-007
                  estado: PENDIENTE
                  fechaRegistro: 2026-11-09T10:45:00
                  idAtencion: 1532
                  idConsumo: 12
                  idProducto: 40
                  idSede: 1
                  producto: Keratina
                  unidad: ML
                estado: FINALIZADA
                horaFin: 2026-11-09T10:45:00
                horaInicio: 2026-11-09T10:02:00
                idAtencion: 1532
                idCita: 950
                idCliente: 407
                idPersonal: 4
                idRecurso: 1
                idVariante: 2
                nombreCliente: Rosaura Quispe
                nombreEspecialista: Lucía Ramos
                nombreRecurso: Sillón 1
                nombreServicio: Corte de Cabello Caballero · Estándar
                observaciones: Sin novedad
                tiempoDeclaradoMin: 45
              schema:
                $ref: "#/components/schemas/AtencionDTO"
          description: "Atención y cita FINALIZADAS; con un paquete activo, la sesió\
            n se descuenta; solo la especialista asignada o la administradora (si\
            \ no, 403 por RN50). Descuenta el consumo estimado de los insumos de la\
            \ variante (RN53, RN54) y, si el stock no alcanza, trae los consumos pendientes\
            \ creados"
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              examples:
                claveTemporal:
                  summary: "Con la clave temporal sin cambiar (CUS50, CUS54)"
                  value:
                    detail: Debe cambiar su clave temporal antes de continuar.
                    regla: RF82
                    status: 403
                    title: Forbidden
                    type: about:blank
                sinPermiso:
                  summary: Sin el permiso de la operación
                  value:
                    detail: No tiene el permiso ATENCION:EDITAR para esta operación.
                    regla: ACCESO_DENEGADO
                    status: 403
                    title: Forbidden
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene el permiso ATENCION:EDITAR para esta operación. (ACCESO_DENEGADO);
            con la clave temporal sin cambiar (RF82)
        "404":
          content:
            application/problem+json:
              example:
                detail: La atención no existe
                regla: RF13
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La atención no existe
        "422":
          content:
            application/problem+json:
              example:
                detail: Solo se finaliza una atención EN_CURSO
                regla: RF13
                status: 422
                title: Unprocessable Content
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Solo se finaliza una atención EN_CURSO
      security:
      - csrf: []
        sesion: []
      summary: Finalizar la atención
      tags:
      - controlador-atencion
      x-cus: CUS11
      x-permiso: ATENCION:EDITAR
  /api/v1/atenciones/{idAtencion}/recomendaciones:
    post:
      operationId: recomendarProducto
      parameters:
      - in: path
        name: idAtencion
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            example:
              idProducto: 40
              observacion: Para mantener el color
            schema:
              $ref: "#/components/schemas/RecomendacionDTO"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                fecha: 2026-11-09T10:31:00
                idAtencion: 1532
                idProducto: 40
                idRecomendacion: 8
                nombreProducto: Shampoo reparador
                observacion: Para mantener el color
              schema:
                $ref: "#/components/schemas/RecomendacionDTO"
          description: La recomendación queda ligada a la atención y aparece en la
            ficha de la clienta
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              examples:
                claveTemporal:
                  summary: "Con la clave temporal sin cambiar (CUS50, CUS54)"
                  value:
                    detail: Debe cambiar su clave temporal antes de continuar.
                    regla: RF82
                    status: 403
                    title: Forbidden
                    type: about:blank
                regla:
                  summary: Regla de la operación
                  value:
                    detail: Solo la especialista de la atención o la Administradora
                    regla: RN50
                    status: 403
                    title: Forbidden
                    type: about:blank
                sinPermiso:
                  summary: Sin el permiso de la operación
                  value:
                    detail: No tiene el permiso ATENCION:EDITAR para esta operación.
                    regla: ACCESO_DENEGADO
                    status: 403
                    title: Forbidden
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene el permiso ATENCION:EDITAR para esta operación. (ACCESO_DENEGADO);
            con la clave temporal sin cambiar (RF82); Solo la especialista de la atención
            o la Administradora (RN50)
        "404":
          content:
            application/problem+json:
              example:
                detail: La atención no existe
                regla: RF13
                status: 404
                title: Not Found
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La atención no existe
        "409":
          content:
            application/problem+json:
              example:
                detail: El producto ya se recomendó en esta atención
                regla: RF16
                status: 409
                title: Conflict
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: El producto ya se recomendó en esta atención
      security:
      - csrf: []
        sesion: []
      summary: Registrar una recomendación de producto
      tags:
      - controlador-atencion
      x-cus: CUS12
      x-permiso: ATENCION:EDITAR
  /api/v1/auditoria:
    get:
      operationId: consultar
      parameters:
      - in: query
        name: idUsuario
        required: false
        schema:
          type: integer
          format: int64
      - in: query
        name: modulo
        required: false
        schema:
          type: string
      - in: query
        name: entidad
        required: false
        schema:
          type: string
      - in: query
        name: fechaInicio
        required: false
        schema:
          type: string
          format: date
      - in: query
        name: fechaFin
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            application/json:
              example:
              - accion: EDITAR
                detalle: "estado: CERRADA -> ANULADA"
                entidad: VENTA
                fechaHora: 2026-11-09T11:30:00
                idAuditoria: 900
                idEntidad: 620
                modulo: Ventas
                rol: ADMINISTRADORA
                usuario: admin
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditoriaDTO"
          description: "V_AUDITORIA con filtros opcionales de usuario, módulo, entidad\
            \ y fechas (sin fechas, los últimos 30 días)"
        "401":
          content:
            application/problem+json:
              example:
                detail: Inicie sesión para continuar.
                regla: SIN_SESION
                status: 401
                title: Unauthorized
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Inicie sesión para continuar.
        "403":
          content:
            application/problem+json:
              examples:
                claveTemporal:
                  summary: "Con la clave temporal sin cambiar (CUS50, CUS54)"
                  value:
                    detail: Debe cambiar su clave temporal antes de continuar.
                    regla: RF82
                    status: 403
                    title: Forbidden
                    type: about:blank
                sinPermiso:
                  summary: Sin el permiso de la operación
                  value:
                    detail: No tiene el permiso SEGURIDAD:VER para esta operación.
                    regla: ACCESO_DENEGADO
                    status: 403
                    title: Forbidden
                    type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No tiene el permiso SEGURIDAD:VER para esta operación. (ACCESO_DENEGADO);
            con la clave temporal sin cambiar (RF82)
        "422":
          content:
            application/problem+json:
              example:
                detail: La fecha de inicio es posterior a la de fin
                regla: RF80
                status: 422
                title: Unprocessable Content
                type: about:blank
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: La fecha de inicio es posterior a la de fin
      security:
      - sesion: []
      summary: Consultar la auditoría
      tags:
